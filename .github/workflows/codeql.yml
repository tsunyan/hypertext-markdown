name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # CodeQL の検査規則は、このリポジトリのコミットとは別に更新される。
    # 週に 1 回動かして、変えていないコードに新しい規則で見つかるものがないかを確かめる
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # javascript-typescript は、HTML に埋め込んだスクリプトも読む。actions はワークフロー自体の検査
          languages: javascript-typescript, python, actions
          # テンプレートの JavaScript は template-guide.src.html が正本。見本・圧縮版・スキルの空のテンプレートは同じコードの写しで、
          # 調べると同じ指摘がファイルの数だけ並ぶので、正本だけを調べる
          config: |
            paths-ignore:
              - "**/*.min.html"
              - samples/**
              - skills/*/assets/template.html
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
