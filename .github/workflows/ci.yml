name: CI

on:
  push:
    branches: [main]
  # ブランチを絞らない。lint・tests・secrets は main の保護で必須にするので、どのプルリクエストでも動かす
  pull_request:
  # gitleaks は、きっかけになったイベントのコミットだけを調べる。履歴全体を調べ直すときは手で動かす
  workflow_dispatch:

permissions:
  contents: read

# Action はタグではなくコミットで固定する。タグは後から別のコードに付け替えられるため、
# 確かめたあとに中身が変わることがある。特に gitleaks は、毎回リポジトリの中身を読む

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # tools/check.py が、HTML に埋め込んだ JavaScript を node --check に通す
          node-version: lts/*
      - name: Install ruff
        # requirements-dev.txt と同じ版を使う。ブラウザなどは要らないので ruff だけ入れる
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: Lint Python
        run: ruff check tools tests
      - name: Check script blocks, JavaScript syntax and the sample
        run: python -I tools/check.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Chromium and Japanese fonts
        # スライドの分割は文字の大きさで決まるので、日本語の書体を入れて、実際に読む環境に近い条件で測る
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run browser tests
        # 図（Mermaid）は CDN から読む。SRI ハッシュが合わなくなったときも、ここで分かる
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks はプルリクエストのコミットの一覧を読む。上の contents だけでは足りない
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 差分だけでなく履歴全体を調べる。後のコミットで消した鍵も、履歴ごと公開されている
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # v3 から、プルリクエストを調べるのに必要
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
